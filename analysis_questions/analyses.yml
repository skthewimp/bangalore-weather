- slug: pre-monsoon-evening-rain
  publish: true
  insightful: true
  title: "Pre-monsoon rain is an evening creature"
  summary: "April-May rain barely exists before afternoon, then climbs hard into the 5-6pm slot. The southwest monsoon still has an afternoon bump, but it is less fussy about the clock."
  blog_url: "blog/pre-monsoon-evening-rain.html"
