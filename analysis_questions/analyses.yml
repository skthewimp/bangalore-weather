- slug: bangalore-summers-hotter
  publish: true
  insightful: true
  title: "Bangalore summers are getting hotter, but mostly at night"
  summary: "The average summer afternoon high is nearly flat from 1981-2025. The clearer signal is warmer nights, a shrinking daily high-low range, and bigger spikes in days above 35 deg C."
  blog_url: "blog/bangalore-summers-hotter.html"
  image: "assets/analysis/bangalore_summer_warming.png"
  image_width: 2160
  image_height: 1620
  image_alt: "Chart showing Bangalore summer highs are nearly flat while summer lows are rising and hot-day spikes are larger."
  links:
    - label: "Open warming chart"
      href: "assets/analysis/bangalore_summer_warming.png"

- slug: summer-showers-cooling
  publish: true
  insightful: true
  title: "Do summer showers actually cool Bangalore?"
  summary: "The short answer is yes, but not in the simplistic way people usually mean it. Rainy afternoons start cooler, end cooler, and still have a proper post-rain drop. The effect changes across April and May."
  blog_url: "blog/summer-showers-cooling.html"
  image: "assets/analysis/summer_showers_cooling.png"
  image_width: 1650
  image_height: 825
  image_alt: "Chart showing Bangalore summer showers cool rainy afternoons and produce a visible post-rain temperature drop."
  links:
