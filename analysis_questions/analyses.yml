- slug: seasonal-wind-shift
  publish: true
  insightful: true
  title: "The wind has a cleaner seasonal story than I expected"
  summary: "From December through March, easterlies dominate. By late May, the city has flipped toward westerlies. The southwest monsoon is the cleanest signal in the dataset."
  blog_url: "blog/seasonal-wind-shift.html"
  image: "assets/analysis/bangalore_wind_river.png"
  image_width: 3600
  image_height: 2100
  image_alt: "Chart showing Bangalore winds shift from winter easterlies to late-May and monsoon westerlies."
